name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # 项目站点：https://<owner>.github.io/<repo>/
  SITE_URL: https://${{ github.repository_owner }}.github.io
  BASE_PATH: /${{ github.event.repository.name }}
  # 成人附录构建开关：改为 'false' 即整站不生成 /nsfw/*，导航与页脚也不出现
  NSFW: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
      - name: 待补图、死链与文风检查
        # 走 npm script 而不是直接跑 check-site.mjs：文风检查（prose-lint）挂在后面，直接跑会绕过它
        run: npm run check:site >> "$GITHUB_STEP_SUMMARY"
      # 这里不要再传一次 pages artifact：withastro/action 构建完已经把 dist/ 传成名为 github-pages 的 artifact，
      # 同名传第二次会冲突失败（2026-11-27 的首次部署就挂在这里）。检查失败时本 job 失败，deploy 不会跑。

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
